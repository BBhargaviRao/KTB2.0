name: ktb2
description: Kids Tech Balance 2.0 - family screen time and engagement app
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  intl: ^0.20.2
  
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

  # State Management + Routing
  flutter_riverpod: ^2.5.1
  go_router: ^16.1.0

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # Utilities
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
          weight: 400

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400